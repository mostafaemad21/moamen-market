<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماركت مؤمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f2;--card:#ffffff;--ink:#14201a;--mute:#5d6a62;--line:#dfe3da;--accent:#1f7a45;--accent-ink:#fff;--shadow:rgba(20,32,26,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f0d;--card:#161b18;--ink:#f2f5f0;--mute:#9aa69e;--line:#27302b;--accent:#3cc77a;--accent-ink:#06210f;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c0f0d;--card:#161b18;--ink:#f2f5f0;--mute:#9aa69e;--line:#27302b;--accent:#3cc77a;--accent-ink:#06210f;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:28px 18px 36px}
header{text-align:center;padding:10px 0 26px}
.mark{width:84px;height:84px;border-radius:26px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:44px;font-weight:900;margin:0 auto 14px;transform:rotate(-6deg)}
h1{font-size:32px;font-weight:900;line-height:1.2}
header p{color:var(--mute);margin-top:6px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 2px 8px var(--shadow);transition:transform .15s}
.item:active{transform:scale(.97)}
.item:focus-visible,.copy:focus-visible,.close:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item svg{width:56px;height:56px}
.item small{color:var(--mute);font-weight:500;font-size:13px;margin-top:-6px}
h2{font-size:15px;color:var(--mute);font-weight:700;margin:26px 4px 10px}
.note{margin-top:24px;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;text-align:center;font-weight:700;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.sheet h3{font-size:22px;font-weight:900}
.sheet p{color:var(--mute);margin:6px 0 16px}
.num{font-size:26px;font-weight:900;letter-spacing:1px;direction:ltr;background:var(--bg);border-radius:14px;padding:14px;word-break:break-all}
.copy,.close{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:900;font-size:17px;cursor:pointer}
.copy{background:var(--accent);color:var(--accent-ink)}
.close{background:transparent;color:var(--mute);font-weight:700}
.info{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px}
.row{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row b{min-width:64px;color:var(--mute);font-weight:700;font-size:14px}
.row span{font-weight:700;font-size:16px}
header{background:linear-gradient(160deg,#0f4a28,#1f7a45 65%,#3cc77a);color:#fff;border-radius:30px;padding:30px 18px 24px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(31,122,69,.35)}
header::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);top:-90px;left:-70px}
header::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-60px;right:-40px}
header>*{position:relative;z-index:1}
.mark{background:#fff;color:#0f4a28;box-shadow:0 8px 20px rgba(0,0,0,.25)}
header p{color:rgba(255,255,255,.88)}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(0,0,0,.25);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px}
.badge i{width:9px;height:9px;border-radius:50%;background:#ff6b6b}
.badge.on i{background:#5dff9a;box-shadow:0 0 0 4px rgba(93,255,154,.25)}
.item{border-radius:24px;padding:20px 10px 16px}
.item svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
#pay .item{border:2px solid var(--accent)}
@media(hover:hover){.item:hover{transform:translateY(-3px)}}
main>.grid .item{animation:in .5s both}
main>.grid .item:nth-child(2){animation-delay:.06s}main>.grid .item:nth-child(3){animation-delay:.12s}main>.grid .item:nth-child(4){animation-delay:.18s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){main>.grid .item{animation:none}}
</style>
</head>
<body>
<main>
<header>
  <div class="mark">م</div>
  <h1>ماركت مؤمن</h1>
  <p>تواصل بسرعة وسهولة</p>
  <span class="badge" id="bd"><i></i><span id="bt"></span></span>
</header>

<div class="grid" id="contact"></div>
<h2>الدفع والتحويل</h2>
<div class="grid" id="pay"></div>
<div class="info">
  <div class="row"><b>العنوان</b><span>ادفو - مصنع السكر - مؤمن ماركت</span></div>
  <div class="row"><b>المواعيد</b><span>من 7 صباحًا إلى 1 صباحًا (تاني يوم)</span></div>
</div>
<div class="note">يرجى إظهار شاشة الدفع بعد التحويل</div>
</main>
<script>
const CONFIG = {
  phone: "01111177487",
  whatsapp: "201111177486",
  maps: "https://maps.app.goo.gl/Q65ktcXpuxqyv25f9?g_st=ac",
  website: "https://mostafaemad21.github.io/moamen-market/",
  instapay: "https://ipn.eg/S/mo2a94/instapay/0HHmDK",
  vodafone: "http://vf.eg/vfcash?id=mt&qrId=dAqxpC",
  /* اتركها فاضية لحد ما تتوفر: */
  facebook: "", instagram: "", tiktok: "", reviews: ""
};
const svg = (bg, inner) => `<svg viewBox="0 0 56 56" aria-hidden="true">${bg}${inner}</svg>`;
const ICONS = {
  phone: svg('<circle cx="28" cy="28" r="28" fill="#1f7a45"/>','<path d="M19 14l5 1 2 7-3 2c2 4 4 6 8 8l2-3 7 2 1 5c0 3-3 5-6 5-11-1-20-10-21-21 0-3 2-6 5-6z" fill="#fff"/>'),
  facebook: svg('<circle cx="28" cy="28" r="28" fill="#1877f2"/>','<path d="M31 46V30h5l1-6h-6v-4c0-2 1-3 3-3h3v-5h-5c-5 0-7 3-7 7v5h-5v6h5v16z" fill="#fff"/>'),
  instagram: svg('<defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".4" stop-color="#fa7e1e"/><stop offset=".7" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect width="56" height="56" rx="16" fill="url(#ig)"/>','<rect x="14" y="14" width="28" height="28" rx="8" fill="none" stroke="#fff" stroke-width="3"/><circle cx="28" cy="28" r="6.5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="36.5" cy="19.5" r="2" fill="#fff"/>'),
  tiktok: svg('<circle cx="28" cy="28" r="28" fill="#000"/>','<path d="M30 15v16a5 5 0 1 1-5-5" fill="none" stroke="#25f4ee" stroke-width="4" stroke-linecap="round" transform="translate(-1.5 1)"/><path d="M30 15v16a5 5 0 1 1-5-5m5-11c1 4 3 6 8 6" fill="none" stroke="#fe2c55" stroke-width="4" stroke-linecap="round" transform="translate(1.5 -1)"/><path d="M30 15v16a5 5 0 1 1-5-5m5-11c1 4 3 6 8 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'),
  whatsapp: svg('<circle cx="28" cy="28" r="28" fill="#25d366"/>','<path d="M28 13a15 15 0 0 0-13 22l-2 8 8-2a15 15 0 1 0 7-28z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M22 21c0 7 6 13 13 13l2-3-4-2-2 1c-2-1-4-3-5-5l1-2-2-4z" fill="#fff"/>'),
  maps: svg('<circle cx="28" cy="28" r="28" fill="#fff" stroke="#dadce0"/>','<path d="M28 9a12 12 0 0 0-12 12c0 9 12 26 12 26s12-17 12-26A12 12 0 0 0 28 9z" fill="#ea4335"/><path d="M16 21a12 12 0 0 1 6-10l6 10z" fill="#4285f4"/><path d="M40 21a12 12 0 0 0-3-8l-9 8z" fill="#fbbc04"/><circle cx="28" cy="21" r="5" fill="#fff"/>'),
  reviews: svg('<circle cx="28" cy="28" r="28" fill="#fff" stroke="#dadce0"/>','<text x="28" y="35" text-anchor="middle" font-family="Arial" font-weight="700" font-size="30" fill="#4285f4">G</text><text x="28" y="48" text-anchor="middle" font-size="9" fill="#fbbc04">★★★★★</text>'),
  website: svg('<circle cx="28" cy="28" r="28" fill="#4285f4"/>','<g fill="none" stroke="#fff" stroke-width="3"><circle cx="28" cy="28" r="15"/><ellipse cx="28" cy="28" rx="6.5" ry="15"/><path d="M13 28h30M16 20h24M16 36h24"/></g>'),
  vodafone: svg('<circle cx="28" cy="28" r="28" fill="#e60000"/>','<circle cx="28" cy="28" r="14" fill="#fff"/><path d="M33 17c-6-1-11 3-11 9 0 7 5 11 10 10-4-1-6-4-6-8 0-5 3-8 7-11z" fill="#e60000"/>'),
  instapay: svg('<rect width="56" height="56" rx="16" fill="#fff" stroke="#dadce0"/>','<path d="M10 15l14 13-14 13z" fill="#7b3fbf"/><path d="M24 15l14 13-14 13z" fill="#f58220"/><path d="M38 15l9 13-9 13z" fill="#f58220" opacity=".55"/>')
};

const items = [
  ["phone","اتصل بنا","tel:"+CONFIG.phone],
  ["whatsapp","واتساب","https://wa.me/"+CONFIG.whatsapp],
  ["maps","الخريطة",CONFIG.maps],
  ["website","الموقع",CONFIG.website],
  ["facebook","فيسبوك",CONFIG.facebook],
  ["instagram","انستجرام",CONFIG.instagram],
  ["tiktok","تيك توك",CONFIG.tiktok],
  ["reviews","قيّمنا على جوجل",CONFIG.reviews]
].filter(i=>i[2]);
const pay = [["vodafone","فودافون كاش",CONFIG.vodafone],["instapay","إنستا باي",CONFIG.instapay]];
const a = ([k,t,h]) => `<a class="item" href="${h}" ${h.startsWith('tel:')?'':'target="_blank" rel="noopener"'}>${ICONS[k]}<span>${t}</span></a>`;
document.getElementById('contact').innerHTML = items.map(a).join('');
document.getElementById('pay').innerHTML = pay.map(a).join('');
const h=+new Intl.DateTimeFormat('en',{hour:'numeric',hour12:false,timeZone:'Africa/Cairo'}).format(new Date())%24;
const on=h>=7||h<1;document.getElementById('bd').classList.toggle('on',on);
document.getElementById('bt').textContent=on?'مفتوح الآن حتى 1 صباحًا':'مغلق الآن - نفتح 7 صباحًا';
</script>
</body>
</html>
